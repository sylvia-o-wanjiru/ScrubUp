<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<meta name="description" content="ScrubUp: nursing revision notes, past-paper tests and ward cases for students in Kenya. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ScrubUp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first study app. Bottom tab bar (Home, Learn, Play, Words). A drug is learned as a swipeable deck of bite-size cards; colour of each card = type of fact, same on every drug. */
:root{
  --paper:#f5f7fb; --sheet:#ffffff; --ink:#1b2a4a; --ink-soft:#5a6782; --rule:#e0e6f0; --accent:#d81b60;
  --moa:#6a3fc7; --moa-bg:#efe8fd; --ind:#1f8a4c; --ind-bg:#e3f5ea; --con:#c62828; --con-bg:#fdeaea;
  --se:#c06600; --se-bg:#fff0db; --int:#1565c0; --int-bg:#e5effc; --nur:#00796b; --nur-bg:#ddf3ef;
  --trick:#8a5a00; --trick-bg:#fff6c2; --gold:#f4b400;
  --font-display:"Bricolage Grotesque","Poppins",system-ui,sans-serif;
  --font-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10162a; --sheet:#1a2340; --ink:#e8edf8; --ink-soft:#a7b2ca; --rule:#2b3658; --accent:#f06292;
  --moa:#b9a0ff; --moa-bg:#2a2352; --ind:#6fd69a; --ind-bg:#15372a; --con:#ff8a80; --con-bg:#3e1d25;
  --se:#ffb54d; --se-bg:#3b2b14; --int:#82b4ff; --int-bg:#182d52; --nur:#5fd3c2; --nur-bg:#123934;
  --trick:#ffe082; --trick-bg:#3a3314; --gold:#ffd54f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10162a; --sheet:#1a2340; --ink:#e8edf8; --ink-soft:#a7b2ca; --rule:#2b3658; --accent:#f06292;
  --moa:#b9a0ff; --moa-bg:#2a2352; --ind:#6fd69a; --ind-bg:#15372a; --con:#ff8a80; --con-bg:#3e1d25;
  --se:#ffb54d; --se-bg:#3b2b14; --int:#82b4ff; --int-bg:#182d52; --nur:#5fd3c2; --nur-bg:#123934;
  --trick:#ffe082; --trick-bg:#3a3314; --gold:#ffd54f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--ink-soft)}
.small{font-size:.8rem}

/* bottom bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:720px}
.tabbtn{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--ink-soft)}
.tabbtn svg{width:24px;height:24px}
.tabbtn[aria-current="page"]{color:var(--accent);font-weight:600}

/* home */
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.hello h1{font-size:1.7rem;font-weight:800}
.brand{display:flex;gap:3px}.brand i{width:9px;height:9px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--ink-soft)}
.stat svg{width:22px;height:22px}
.goal{margin-top:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:14px}
.goal-top{display:flex;justify-content:space-between;font-size:.85rem;font-weight:500}
.bar{height:10px;border-radius:5px;background:var(--rule);overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:5px;transition:width .4s}
.big-cta{margin-top:14px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:20px;padding:16px;background:var(--ink);color:var(--sheet)}
.big-cta svg{width:72px;height:56px;flex:none;background:var(--sheet);border-radius:12px;padding:4px}
.big-cta b{font-family:var(--font-display);font-size:1.25rem;display:block}
.big-cta span{font-size:.82rem;opacity:.85}
.sec-title{margin:22px 0 10px;font-size:1.15rem;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:0;text-align:left;border-radius:18px;padding:14px;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative}
.tile b{font-family:var(--font-display);font-size:1.08rem;line-height:1.2;color:var(--c)}
.tile span{font-size:.78rem;color:var(--ink-soft)}
.tile .done{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--ind);color:var(--sheet);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.tile svg.mini{width:64px;height:40px}
.c-moa{--c:var(--moa);--bg:var(--moa-bg)} .c-ind{--c:var(--ind);--bg:var(--ind-bg)} .c-con{--c:var(--con);--bg:var(--con-bg)}
.c-se{--c:var(--se);--bg:var(--se-bg)} .c-int{--c:var(--int);--bg:var(--int-bg)} .c-nur{--c:var(--nur);--bg:var(--nur-bg)} .c-trick{--c:var(--trick);--bg:var(--trick-bg)}
.linkcard{margin-top:10px;display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--rule);background:var(--sheet);border-radius:16px;padding:14px;text-align:left}
.group-h{margin:18px 0 8px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}

/* deck */
.deck-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.x{border:1px solid var(--rule);background:var(--sheet);width:38px;height:38px;border-radius:50%;font-size:1.1rem;flex:none}
.segs{display:flex;gap:4px;flex:1}
.segs i{flex:1;height:5px;border-radius:3px;background:var(--rule)}
.segs i.on{background:var(--accent)}
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;padding-bottom:4px}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;background:var(--bg);border-radius:24px;padding:22px 20px;min-height:min(560px,68vh);display:flex;flex-direction:column;gap:12px;min-width:0}
.slide .kicker{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--c)}
.slide h2{font-size:1.65rem;font-weight:800;color:var(--c);line-height:1.15}
.slide h2.drugname{font-size:2.3rem;color:var(--accent)}
.slide p{margin:0}
.slide .lead{font-size:1.08rem;font-weight:500}
.slide svg.pic{width:100%;max-width:340px;height:auto;align-self:center}
.slide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.slide li::marker{color:var(--c)}
.slide details{margin-top:auto;background:var(--sheet);border-radius:14px;padding:10px 14px}
.slide summary{font-weight:600;color:var(--c);cursor:pointer}
.slide details ul,.slide details ol{margin-top:8px}
.slide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.75rem;padding:3px 10px;border-radius:999px;background:var(--sheet);color:var(--ink-soft)}
.pill.strong{background:var(--ink);color:var(--sheet)}
.danger{background:var(--sheet);border-radius:14px;padding:10px 14px;border:2px solid var(--con)}
.danger b{color:var(--con);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.trio{display:flex;flex-direction:column;gap:10px}
.trio>div{background:var(--sheet);border-radius:14px;padding:10px 14px}
.trio b{font-family:var(--font-display);color:var(--c)}
.trio ul{margin-top:4px}
.whyq{border:0;width:100%;text-align:left;background:var(--sheet);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.whyq b{font-family:var(--font-display);font-size:1.02rem}
.whyq .ans{color:var(--ink)}
.whyq .tap{font-size:.75rem;color:var(--c);font-weight:600}
.trickbox{font-family:var(--font-display);font-size:1.45rem;font-weight:800;line-height:1.25;color:var(--ink);background:var(--sheet);border:3px dashed var(--c);border-radius:18px;padding:18px}
.kenya{font-size:.88rem;background:var(--sheet);border-radius:14px;padding:10px 14px}
.deck-nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:11px 18px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.hint{text-align:center;font-size:.75rem;color:var(--ink-soft);margin-top:6px}

/* questions */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:14px;padding:11px 14px}
.opt.right{border-color:var(--ind);background:var(--ind-bg)}
.opt.wrong{border-color:var(--con);background:var(--con-bg)}
.opt:disabled{cursor:default}
.explain{border-radius:14px;padding:10px 14px;background:var(--sheet);font-size:.9rem}
.qtext{font-family:var(--font-display);font-size:1.25rem;font-weight:600;line-height:1.3}
.xp-pop{font-family:var(--font-display);font-weight:800;color:var(--gold);font-size:1.4rem}

/* games */
.game{background:var(--sheet);border:1px solid var(--rule);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.gametop{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;font-weight:600}
.timer{font-family:var(--font-display);font-size:1.6rem;color:var(--accent)}
.statement{font-family:var(--font-display);font-size:1.4rem;font-weight:600;line-height:1.3;min-height:5.2em;display:flex;align-items:center}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf button{border:0;border-radius:18px;padding:18px;font-family:var(--font-display);font-size:1.3rem;font-weight:800;color:#fff}
.tf .t{background:var(--ind)} .tf .f{background:var(--con)}
.flash-ok{animation:ok .35s} .flash-no{animation:no .35s}
@keyframes ok{50%{box-shadow:0 0 0 6px var(--ind)}} @keyframes no{50%{box-shadow:0 0 0 6px var(--con)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mbtn{border:2px solid var(--rule);background:var(--paper);border-radius:14px;padding:12px 10px;min-height:64px;font-size:.88rem;font-weight:500}
.mbtn.sel{border-color:var(--accent)}
.mbtn.ok{border-color:var(--ind);background:var(--ind-bg);opacity:.55;cursor:default}
.mbtn.bad{border-color:var(--con);background:var(--con-bg)}
.gtile{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:0;border-radius:20px;padding:16px;background:var(--bg);color:var(--ink)}
.gtile b{font-family:var(--font-display);font-size:1.2rem;color:var(--c);display:block}
.gtile span{font-size:.82rem;color:var(--ink-soft)}
.gtile .num{font-family:var(--font-display);font-weight:800;font-size:1.8rem;color:var(--c);width:56px;flex:none;text-align:center}
.gstack{display:flex;flex-direction:column;gap:10px}

/* words + notes */
.search{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit}
.words{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.word{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:10px 14px}
.word b{color:var(--accent);display:block}
.word em{display:block;font-size:.8rem;color:var(--ink-soft)}
.term{border:0;background:none;padding:0;border-bottom:2px dotted currentColor;font:inherit;color:inherit;position:relative}
.tip{position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:max-content;max-width:min(250px,70vw);background:var(--ink);color:var(--sheet);font-size:.8rem;line-height:1.45;padding:8px 10px;border-radius:10px;text-align:left;font-weight:400}
.nrow{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.badge{align-self:flex-start;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:6px;padding:2px 8px}
.b-ok{background:var(--ind-bg);color:var(--ind)} .b-fix{background:var(--con-bg);color:var(--con)} .b-add{background:var(--int-bg);color:var(--int)}
.said{font-style:italic;color:var(--ink-soft);margin:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:999px;font-weight:600;z-index:40;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.deck{scroll-behavior:auto}}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---- clinical layer ---- */
:root{--sil:#dfe7f2;--sil-line:#c9d4e4;--organ:#9fb0c8;--paperline:#e9eef6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sil:#26314f;--sil-line:#34416a;--organ:#5d6d92;--paperline:#232d4b}}
:root[data-theme="dark"]{--sil:#26314f;--sil-line:#34416a;--organ:#5d6d92;--paperline:#232d4b}
.wrap{max-width:820px}
.tabbar-in{grid-template-columns:repeat(5,1fr);max-width:820px}
.ph{font-size:1.7rem;font-weight:800}
.sub{margin:4px 0 14px}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);margin:0;display:flex;align-items:center;gap:6px}
.xmark{width:14px;height:14px;flex:none}
.stack{display:flex;flex-direction:column;gap:10px}
.wide{width:100%;margin-top:12px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small-btn{padding:6px 12px;font-size:.8rem;border-radius:10px;text-decoration:none;color:var(--ink);display:inline-block}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.crumb{font-weight:600;flex:1;min-width:0}
.clock{font-family:var(--font-display);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}

.ward{position:relative;border-radius:22px;background:var(--ink);color:var(--sheet);overflow:hidden;margin-bottom:12px}
.ward .ecg{position:absolute;inset:auto 0 0 0;width:100%;height:60px;opacity:.5}
.ward .ecg path{fill:none;stroke:var(--nur-bg);stroke-width:2;stroke-dasharray:100;stroke-dashoffset:100;animation:ecg 3.2s linear infinite}
@keyframes ecg{to{stroke-dashoffset:-100}}
.ward-in{position:relative;padding:18px 18px 46px}
.ward h1{font-size:1.6rem;font-weight:800;margin-top:6px}
.ward p{margin:4px 0 0;opacity:.8;font-size:.82rem}
.brandrow{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.85rem}
.brandrow .xmark{width:20px;height:20px}
.lvl{font-size:1rem!important;line-height:1.2!important}
.big-cta .eyebrow{color:inherit;opacity:.7}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.modchip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:8px 12px;font-size:.82rem;max-width:220px;text-align:left}
.modchip.more{font-weight:600;color:var(--accent)}
.mcode{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:8px;background:var(--mc,var(--ink));color:#fff;font-family:var(--font-display);font-weight:800;font-size:.8rem}
.mcode.big{min-width:44px;height:44px;font-size:1rem;border-radius:12px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.modtile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:18px;padding:14px;border-top:5px solid var(--mc)}
.modtile b{font-family:var(--font-display);font-size:1.05rem;line-height:1.2}
.mmeta{font-size:.75rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mmeta em{font-style:normal;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--rule);color:var(--ink)}
.mmeta em.ready{background:var(--ind-bg);color:var(--ind)}
.modhead{display:flex;gap:14px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--mc);border-radius:18px;padding:14px}
.modhead h1{font-size:1.4rem;font-weight:800}
.modhead p{margin:2px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.empty{display:flex;gap:12px;align-items:flex-start;background:var(--sheet);border:1px dashed var(--organ);border-radius:16px;padding:14px;margin-top:14px}
.empty .xmark{width:28px;height:28px}
.empty p{margin:4px 0 0}

/* drug profile: hospital drug chart */
.chart{background:var(--sheet);border:1px solid var(--rule);border-radius:20px;padding:18px;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--paperline) 27px 28px);border-left:6px solid var(--accent)}
.chart-top{display:flex;gap:14px;align-items:center}
.rx{font-family:var(--font-display);font-size:2.6rem;font-weight:800;color:var(--accent);line-height:1;width:58px;height:58px;display:grid;place-items:center;border:3px solid var(--accent);border-radius:14px;flex:none;background:var(--sheet)}
.chart h1{font-size:2rem;font-weight:800;line-height:1.1}
.kardex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:14px 0 0;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--sheet)}
.kardex div{padding:8px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.kardex .full{grid-column:1/-1;border-right:0;border-bottom:0}
.kardex dt{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.kardex dd{margin:0;font-weight:500;font-size:.9rem}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.key{display:inline-flex;align-items:center;gap:6px;background:var(--sheet);border:1.5px solid var(--accent);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:600}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:20px;padding:16px 18px;margin-top:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.tint{background:var(--bg);border-color:transparent}
.panel h2{font-size:1.2rem;font-weight:800;color:var(--c,var(--ink))}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel ul,.panel ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.panel li::marker{color:var(--c,var(--accent))}
.panel details{background:var(--sheet);border-radius:12px;padding:8px 12px}
.panel.tint details{background:var(--sheet)}
.panel summary{font-weight:600;color:var(--c,var(--accent));cursor:pointer}
.panel details ul,.panel details ol{margin-top:6px}
.panel svg.pic{width:100%;max-width:360px;align-self:center}
.panel .lead{font-size:1.05rem;font-weight:500;margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.mlabel{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--rule)}

.vline{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--ink-soft);margin:8px 0 0}
.vline .ic{width:14px;height:14px}
.mastercard{background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mc-top{display:flex;gap:14px;align-items:center}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--ind) calc(var(--p)*1%),var(--rule) 0);display:grid;place-items:center;flex:none}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--sheet);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:.9rem}
.hist{display:flex;gap:8px;align-items:flex-end;height:70px;padding-top:4px}
.hist span{flex:1;max-width:42px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.hist i{display:block;width:100%;border-radius:6px 6px 2px 2px}
.hist i.hi{background:var(--ind)}.hist i.mid{background:var(--se)}.hist i.lo{background:var(--con)}
.hist em{font-style:normal;font-size:.65rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chip.weak{border-color:var(--con);color:var(--con)}
.duebadge{font-style:normal;font-size:.68rem;font-weight:700;color:var(--int);background:var(--int-bg);border-radius:999px;padding:1px 8px;display:inline-flex;align-items:center;gap:4px}
.duebadge .ic{width:12px;height:12px}
.traybtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--moa);background:var(--moa-bg);border-radius:16px;padding:12px 14px;margin-top:10px;color:var(--ink)}
.traybtn>.ic{color:var(--moa)}.traybtn>span:nth-child(2){flex:1}.traybtn b{display:block}.traybtn em{font-style:normal;font-size:.76rem;color:var(--ink-soft)}
.tray-opts{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
.tray-opts li.right{font-weight:700;color:var(--ind)}
.approve{border-color:var(--ind);color:var(--ind)}
.approve .ic,.danger-btn .ic{width:14px;height:14px;vertical-align:-2px}
.linkbadge{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:var(--int);background:var(--int-bg);border-radius:8px;padding:3px 8px;align-self:flex-start}
.linkbadge .ic{width:14px;height:14px}
.connect{background:var(--int-bg);border:0;border-radius:18px;padding:14px;margin-top:16px}
.connect .eyebrow{color:var(--int)}.connect .eyebrow .ic,.connect h2 .ic{width:16px;height:16px;vertical-align:-2px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.cchip{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:10px;color:var(--ink)}
.cchip>span:nth-child(2){min-width:0}.cchip b{display:block;font-size:.85rem;line-height:1.25}.cchip em{font-style:normal;font-size:.72rem;color:var(--ink-soft)}
.chart.cond .rx{color:var(--con);border-color:var(--con)}.chart.cond .rx .ic{width:30px;height:30px}
.chain{list-style:none;padding:0!important;display:flex!important;flex-direction:column;gap:0!important;counter-reset:ch}
.chain li{position:relative;background:var(--sheet);border-radius:12px;padding:8px 12px 8px 40px;margin-bottom:18px;counter-increment:ch}
.chain li::before{content:counter(ch);position:absolute;left:10px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--moa);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center}
.chain li:not(:last-child)::after{content:"↓";position:absolute;left:50%;bottom:-17px;color:var(--moa);font-weight:800}
.chain li:last-child{border:2px solid var(--con);margin-bottom:0}
.np{display:flex;flex-direction:column;gap:8px}
.npstep{background:var(--paper)!important;border-radius:14px!important;padding:10px 12px!important}
.npstep summary{display:flex;gap:10px;align-items:center;list-style:none;color:var(--ink)!important}
.npstep summary::-webkit-details-marker{display:none}
.npstep summary b{display:block}.npstep summary em{font-style:normal;font-size:.75rem;color:var(--ink-soft);font-weight:400}
.npn{width:36px;height:36px;border-radius:10px;background:var(--nur);color:#fff;display:grid;place-items:center;flex:none}
.npn .ic{width:20px;height:20px}
.npstep>ul{margin-top:8px!important}
.why-list{list-style:none;padding:0!important}
.why-list li{background:var(--sheet);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.why-list span{font-size:.82rem;color:var(--nur)}
.updbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:60;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--sheet);border-radius:16px;padding:10px 14px;width:min(94vw,460px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.updbar span{flex:1}.updbar small{opacity:.75}
.result .ic{width:14px;height:14px;vertical-align:-2px}

/* short tabbed topic pages */
.phead{display:flex;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-left:6px solid var(--accent);border-radius:18px;padding:12px 14px}
.phead h1{font-size:1.5rem;font-weight:800;line-height:1.1}
.phead p{margin:0}.phead .mrow{margin-top:6px}
.rx.sm{width:44px;height:44px;font-size:1.8rem;border-width:2px;border-radius:12px}.rx.sm .ic{width:24px;height:24px;color:var(--con)}
.ptabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--paper);padding:10px 0 8px;margin-top:4px}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;border:1px solid var(--rule);background:var(--sheet);border-radius:12px;padding:6px 8px;font-size:.7rem;font-weight:600;color:var(--ink-soft)}
.ptab .ic{width:20px;height:20px}
.ptab[aria-current="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.psec>.panel:first-child,.psec>.chart:first-child{margin-top:0}
.psec>.chart+.panel{margin-top:12px}
.pnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.pnav .ic{width:16px;height:16px;vertical-align:-3px}
/* body + info side by side, even on phones */
.bodypanel .bodygrid{grid-template-columns:minmax(110px,40%) minmax(0,1fr)!important;gap:10px;align-items:start}
.bodypanel svg.body{max-width:170px}
.bodypanel .organ{position:sticky;top:90px;min-height:0;padding:12px}
.bodypanel .organ-h{font-size:1.05rem}
.bodypanel .organ .kicker{display:none}
.bodypanel .onote p{font-size:.86rem}
.bodypanel .legend{justify-content:flex-start}
.chart.cond .kardex{grid-template-columns:1fr}
</style>

<script>
/* ===================== PICTURES (how each drug works) ===================== */
const T = (x,y,s,txt,extra="") => `<text x="${x}" y="${y}" font-size="${s}" fill="var(--ink)" font-family="Poppins,sans-serif" ${extra}>${txt}</text>`;
const PICS = {
 thermostat:`<svg class="pic" viewBox="0 0 220 130" role="img" aria-label="A brain thermostat dial turned down from hot to cool">

  <path class="an-x" d="M118 14 L190 44 M190 14 L118 44" stroke="var(--con)" stroke-width="4" stroke-linecap="round"/>
  ${T(122,64,10,"pain · fever · swelling")} ${T(150,78,10,"switched OFF","fill='var(--con)' font-weight='600'")}
  <rect x="138" y="88" width="56" height="24" rx="12" fill="var(--rule)"/><circle cx="150" cy="100" r="9" fill="var(--con)"/>${T(164,104,10,"OFF")}
 </svg>`,
 trojan:`<svg class="pic" viewBox="0 0 220 130" role="img" aria-label="Flucytosine enters the fungal cell and turns into 5-FU which breaks DNA and RNA">
  <ellipse cx="128" cy="66" rx="82" ry="54" fill="var(--sheet)" stroke="var(--moa)" stroke-width="3" stroke-dasharray="210 14"/>
  ${T(140,22,9,"fungal cell")}
  <g class="an-enter"><rect x="14" y="54" width="26" height="22" rx="4" fill="var(--moa)"/>${T(17,69,9,"5-FC","fill='#fff' font-weight='700'")}</g>
  <path d="M42 65 h20" stroke="var(--moa)" stroke-width="3" marker-end="url(#am)"/>
  <defs><marker id="am" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--moa)"/></marker></defs>
  <path class="an-pulse" d="M88 50 l8 -12 l6 10 l10 -8 l0 14 l12 2 l-10 8 l8 10 l-14 -2 l-4 12 l-6 -12 l-12 4 l4 -12 l-10 -6 z" fill="var(--con)"/>
  ${T(94,68,9,"5-FU","fill='#fff' font-weight='700'")}
  <path d="M150 42 q8 8 0 16 q-8 8 0 16 q8 8 0 16" fill="none" stroke="var(--int)" stroke-width="3"/>
  <path d="M166 42 q-8 8 0 16 M166 74 q-8 8 0 16" fill="none" stroke="var(--int)" stroke-width="3"/>
  <path class="an-dash" d="M140 66 l34 0" stroke="var(--con)" stroke-width="3" stroke-dasharray="4 3"/>
  ${T(136,108,9,"DNA & RNA broken")}
 </svg>`,
 bricks:`<svg class="pic" viewBox="0 0 220 130" role="img" aria-label="A fungal wall with missing ergosterol bricks so it leaks">
  ${[0,1,2,3].map(r=>[0,1,2,3,4,5].map(c=>{const miss=(r===1&&c===3)||(r===2&&c===1)||(r===3&&c===4)||(r===0&&c===2);const x=14+c*32+(r%2?16:0);return miss?`<rect x="${x}" y="${14+r*22}" width="28" height="18" rx="3" fill="none" stroke="var(--con)" stroke-width="2" stroke-dasharray="3 3" class="an-blink"/>`:`<rect x="${x}" y="${14+r*22}" width="28" height="18" rx="3" fill="var(--se)" opacity=".85"/>`}).join("")).join("")}
  ${T(14,118,11,"No ergosterol bricks = leaky wall")}
 </svg>`,
 holes:`<svg class="pic" viewBox="0 0 220 130" role="img" aria-label="Amphotericin punches holes in the fungal membrane and the contents leak out">
  <ellipse cx="100" cy="64" rx="70" ry="46" fill="var(--moa-bg)" stroke="var(--moa)" stroke-width="5"/>
  <circle cx="168" cy="54" r="6" fill="var(--sheet)" stroke="var(--ink)"/><circle cx="160" cy="88" r="6" fill="var(--sheet)" stroke="var(--ink)"/><circle cx="60" cy="24" r="6" fill="var(--sheet)" stroke="var(--ink)"/>
  <g class="an-leak"><circle cx="186" cy="48" r="4" fill="var(--se)"/><circle cx="200" cy="58" r="3" fill="var(--se)"/><circle cx="178" cy="98" r="4" fill="var(--se)"/><circle cx="194" cy="106" r="3" fill="var(--se)"/><circle cx="50" cy="8" r="3" fill="var(--se)"/></g>
  ${T(62,68,11,"fungus","font-weight='600'")} ${T(118,124,10,"K⁺ and contents leak out")}
 </svg>`,

  <path d="M146 58 q8 -10 16 0" fill="none" stroke="var(--int)" stroke-width="3"/>
  <path class="an-blink" d="M136 44 l4 8 l-6 4 l6 8" stroke="var(--con)" stroke-width="3" fill="none"/>
  ${T(18,82,10,"no oxygen")} ${T(84,112,10,"Germ arms the drug, DNA breaks")}
 </svg>`,
 race:`<svg class="pic" viewBox="0 0 220 130" role="img" aria-label="Graph of malaria parasites over 3 days: a steep fall from artemether then a slow clean-up by lumefantrine">
  <path d="M30 14 V100 H206" fill="none" stroke="var(--ink-soft)" stroke-width="2"/>
  <path class="an-draw" d="M32 20 C44 70, 56 82, 78 86 S150 96, 204 99" fill="none" stroke="var(--con)" stroke-width="4" pathLength="100"/>
  <path d="M34 22 C46 70, 58 80, 78 84" fill="none" stroke="var(--gold)" stroke-width="9" opacity=".45"/>
  <path d="M80 86 C120 92, 160 97, 204 99" fill="none" stroke="var(--int)" stroke-width="9" opacity=".3"/>
  ${T(54,40,10,"artemether: fast kill","font-weight='600'")} ${T(104,80,10,"lumefantrine: clears the rest","font-weight='600'")}
  ${T(6,18,9,"parasites")} ${T(30,116,9,"Day 0")} ${T(110,116,9,"Day 1–2")} ${T(178,116,9,"Day 3")}
 </svg>`
};

/* ===================== CONTENT ===================== */
const DRUGS = [
{ id:"paracetamol", group:"Pain & fever", tone:"c-se", pic:"thermostat", name:"Paracetamol", say:"pa-ra-SEE-ta-mol", cls:"Analgesic & antipyretic", brands:["Panadol","Calpol"],
  one:"Takes away mild to moderate pain and brings down fever. Gentle on the stomach. Too much destroys the liver.",
  big:"It turns down the brain's thermostat and quiets pain signals. It works in the brain, so it does very little for swelling.",
  moa:["Blocks the making of prostaglandins (pain and fever messengers), mainly in the brain and spinal cord.","Resets the temperature centre in the brain (hypothalamus), so fever comes down.","Has almost no anti-inflammatory effect in the body."],
  ind:["Mild to moderate pain: headache, toothache, period pain","Fever, including in children","Added to stronger painkillers for better relief"],
  con:["Allergy (hypersensitivity) to paracetamol","Severe liver disease","Take care: heavy alcohol use, malnutrition or low body weight"],
  se:{common:["Rare at normal doses","Skin rash (uncommon)"],danger:["Overdose: liver damage (hepatotoxicity). Vomiting, right upper belly pain, yellow eyes after 1–3 days"]},
  inter:["Alcohol: more liver damage","Other products with paracetamol (cold and flu syrups, Panadol Extra): accidental double dose","Warfarin: regular high doses can thin the blood more (raised INR)","Carbamazepine, phenytoin, rifampicin, isoniazid: liver damage more likely"],
  nurse:{assess:["Pain score or temperature before, and 30–60 minutes after","Everything else taken in the last 24 hours","Liver risk: alcohol, low weight, liver disease"],give:["Adult usual maximum 4 g in 24 hours (8 × 500 mg); lower if liver risk","At least 4 hours between doses","Children: dose by weight"],teach:["No alcohol with it","Read labels of cough and cold medicines","An overdose needs hospital at once even if the person feels fine. Antidote: N-acetylcysteine (NAC)"]},
  why:[["Why can a paracetamol overdose look fine on day 1?","The liver is damaged silently. Vomiting, pain and yellow eyes only show after 1–3 days, when the damage is severe. So every overdose goes to hospital at once."],["Why doesn't paracetamol bring down swelling?","It works mostly in the brain and spinal cord, not at the injury. Ibuprofen works at the injury, so it reduces swelling."]],
  trick:"Two P's and an L: Pain, Pyrexia, protect the Liver. Max 4 g = 8 tablets.",
  kenya:"Sold everywhere over the counter, and hidden in many cough and cold syrups. Always ask what else the patient took at home."},

{ id:"ibuprofen", group:"Pain & fever", tone:"c-se", pic:"factory", name:"Ibuprofen", say:"eye-byoo-PROE-fen", cls:"NSAID", brands:["Brufen","Nurofen"],
  one:"Painkiller that also reduces swelling and fever. Can hurt the stomach, kidneys and heart if misused.",
  big:"It switches off the COX 'factory' that makes pain, fever and swelling chemicals. The same factory protects the stomach and kidneys, so they lose protection too.",
  moa:["Blocks the COX-1 and COX-2 enzymes all over the body.","Less prostaglandin is made, so there is less pain, fever and swelling (inflammation).","Blocking COX-1 removes the stomach's protective mucus and reduces blood flow to the kidneys. That causes the side effects."],
  ind:["Pain with swelling: sprains, arthritis, dental pain","Period pain (dysmenorrhoea)","Fever","Pain after surgery, when the doctor allows"],
  con:["Allergy to ibuprofen, aspirin or any NSAID, including asthma that gets worse with aspirin","Active stomach ulcer or gut bleeding","Severe kidney, liver or heart failure","Pregnancy, especially after 20 weeks","Take care: elderly, high blood pressure, dehydration"],
  se:{common:["Indigestion (dyspepsia), heartburn, nausea","Stomach pain, diarrhoea","Headache, dizziness"],danger:["Ulcer bleeding: black tarry stool, vomiting blood","Kidney injury: passing less urine","Wheezing in sensitive asthmatics","Raised blood pressure, swelling"]},
  inter:["Warfarin, aspirin, other NSAIDs: more bleeding","Steroids (prednisolone): more ulcers","Enalapril and furosemide: kidney injury, and BP tablets work less well","Lithium, methotrexate: toxic levels","Fluoxetine and other SSRIs: more bleeding"],
  nurse:{assess:["Ulcers, asthma, kidney or heart disease, pregnancy","Pain, swelling, temperature","Blood pressure and urine output with long use"],give:["With or after food or milk","Lowest dose, shortest time"],teach:["Report black stool, vomiting blood or stomach pain","Don't combine with diclofenac, aspirin or other NSAIDs","Drink enough fluids"]},
  why:[["Why give ibuprofen with food?","COX-1 makes prostaglandins that protect the stomach lining. Ibuprofen blocks them, so acid attacks the stomach. Food reduces irritation, but keep the course short."],["Why can it harm the kidneys?","Prostaglandins keep the kidney blood vessels open. Block them in a dehydrated or elderly patient and the kidneys get too little blood."]],
  trick:"NSAIDs hurt 4 organs: Stomach, Lungs, Kidneys, Heart. Ask about all four before you give.",
  kenya:"Over the counter. Nurofen is plain ibuprofen. Some other brands mix ibuprofen with paracetamol, so read the label."},

{ id:"flucytosine", group:"Antifungals", tone:"c-moa", pic:"trojan", name:"Flucytosine", say:"floo-SY-toe-seen", cls:"Antifungal", brands:["Ancobon","5-FC"],

function addXP(n){const t=todayStr(); if(P.last!==t){P.streak=(P.last===todayStr(-1))?P.streak+1:1;P.last=t} if(P.today.day!==t)P.today={day:t,xp:0}; P.xp+=n;P.today.xp+=n;save();toast(`+${n} XP`)}

function level(){let l=LEVELS[0],next=null;LEVELS.forEach((x,i)=>{if(P.xp>=x[0]){l=x;next=LEVELS[i+1]||null}});return {name:l[1],next}}

const DB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open("rangi",2);r.onupgradeneeded=()=>{const d=r.result;["res","qs","mods"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"})})};r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async all(s){if(!DB.db)await DB.open();return new Promise((res,rej)=>{const q=DB.db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.added-a.added));q.onerror=()=>rej(q.error)})},
  async put(s,x){if(!DB.db)await DB.open();return new Promise((res,rej)=>{const t=DB.db.transaction(s,"readwrite");t.objectStore(s).put(x);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async del(s,id){if(!DB.db)await DB.open();return new Promise((res,rej)=>{const t=DB.db.transaction(s,"readwrite");t.objectStore(s).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};

/* ===================== MASTERY: spaced repetition + history ===================== */
const BOXDAYS=[1,2,4,7,15,30];
let MS=store.get("rn_mastery",{});
function recordAns(q,ok){
  if(!q||!q.id)return;
  const r=MS[q.id]||{box:0,seen:0,right:0,wrong:0};
  r.seen++; if(ok){r.right++;r.box=Math.min(r.box+1,5)}else{r.wrong++;r.box=0}
  r.due=todayStr(BOXDAYS[r.box]); r.last=ok?1:0; r.at=Date.now();
  MS[q.id]=r; store.set("rn_mastery",MS);
}
const dueQs=m=>qsFor(m).filter(q=>MS[q.id]&&MS[q.id].due<=todayStr());
const mistakeQs=m=>qsFor(m).filter(q=>MS[q.id]&&MS[q.id].last===0);
function mastery(list){ if(!list.length)return {pct:0,seen:0,n:0}; let sum=0,seen=0; list.forEach(q=>{const r=MS[q.id];if(r){seen++;sum+=r.box}}); return {pct:Math.round(sum/(list.length*5)*100),seen,n:list.length}; }
const topicMastery=id=>mastery(allQs().filter(q=>testable(q)&&q.topic===id));
const mLabel=p=>p.seen===0?"Not started":p.seen/p.n<0.3?"Just started":p.pct<40?"Weak":p.pct<75?"Getting there":"Strong";
const mClass=p=>p.seen===0||p.seen/p.n<0.3?"m0":p.pct<40?"m1":p.pct<75?"m2":"m3";
const mBar=p=>`<span class="mast ${mClass(p)}" title="Mastery ${p.pct}%"><i style="width:${Math.max(p.seen?6:0,p.pct)}%"></i></span>`;
function weakTopics(m){
  const ids=TOPICS().filter(t=>t.module===m).map(t=>t.id);
  return ids.map(id=>{const qs=allQs().filter(q=>testable(q)&&q.topic===id&&MS[q.id]);const wrong=qs.filter(q=>MS[q.id].last===0).length;return {id,p:{pct:qs.length?Math.round((qs.length-wrong)/qs.length*100):0},seen:qs.length,wrong}})
   .filter(x=>x.seen&&x.wrong/x.seen>=0.5).sort((a,b)=>a.p.pct-b.p.pct);
}

   ${q.type==="mcq"?`<ol class="tray-opts" type="A">${q.o.map((o,i)=>`<li class="${i===q.a?'right':''}">${esc(o)}${i===q.a?" ✓":""}</li>`).join("")}</ol>${q.e?`<p class="small muted">${esc(q.e)}</p>`:""}`:`<p class="eyebrow">Marking scheme</p>${L(String(q.model).split("\n").filter(Boolean))}`}

  <button class="btn wide" data-traydone>Done</button>`;
}
const noteItems=(res)=>`<div class="notelist">${res.map(r=>`<button class="noteitem" data-sheet="res" data-id="${r.id}"><span class="rkind">${r.ai?"AI":{file:"FILE",link:"LINK",note:"NOTE"}[r.kind]}</span><span><b>${esc(r.title)}</b><em>${r.kind==="file"?(r.type||"").includes("pdf")?"PDF":"Photo":r.kind==="link"?"Link":"Note"}${r.pack?" · from ScrubUp":""}${r.ai?" · AI draft":""}</em></span><span aria-hidden="true">→</span></button>`).join("")}</div>`;
const helper=(m,text)=>`<section class="helper"><b>${text}</b><div class="iconrow"><button class="ib" data-addres="${m.id}" data-k="file">${ic("camera")}<span>Photo</span></button><button class="ib" data-addres="${m.id}" data-k="file">${ic("file")}<span>PDF</span></button><button class="ib" data-addres="${m.id}" data-k="link">${ic("link")}<span>Link</span></button><button class="ib" data-addres="${m.id}" data-k="note">${ic("pen")}<span>Note</span></button></div><p class="small muted" style="margin:0">${ic("spark")} AI can turn it into revision points and questions.</p></section>`;
function goalView(m){
  const g=GOALS.find(x=>x.id===view.goal), qs=qsFor(m.id), res=resFor(m.id), isPh=m.id==="pharm";
  let body="";
  if(g.id==="learn"){

    const due=dueQs(m.id).length, mis=mistakeQs(m.id).length, mp=mastery(qs), weak=weakTopics(m.id), tray=trayFor(m.id).length, att=ATT.filter(a=>a.module===m.id).slice(0,6).reverse();
    body=`<section class="mastercard"><div class="mc-top"><div class="ring" style="--p:${mp.pct}"><span>${mp.pct}%</span></div><div><b>Mastery: ${mLabel(mp)}</b><p class="small muted" style="margin:0">${mp.seen} of ${mp.n} questions tried</p></div></div>
      ${att.length?`<div class="hist" aria-label="Last test scores">${att.map(a=>`<span title="${a.pct}%"><i style="height:${Math.max(6,a.pct)}%" class="${a.pct>=70?'hi':a.pct>=50?'mid':'lo'}"></i><em>${a.pct}</em></span>`).join("")}</div><p class="small muted" style="margin:0">Last ${att.length} tests</p>`:""}
      ${weak.length?`<p class="group-h" style="margin:6px 0 0">Weak spots</p><div class="chips" style="margin:4px 0 0">${weak.slice(0,6).map(w=>`<button class="chip weak" ${topicAttr(topicById(w.id)||{kind:"drug",id:w.id})}>${esc(topicName(w.id))} · ${w.p.pct}% right</button>`).join("")}</div>`:""}</section>
    ${tray?`<button class="traybtn" data-tray>${ic("spark")}<span><b>${tray} AI questions to check</b><em>Check them before they go into your tests</em></span><span aria-hidden="true">→</span></button>`:""}
    <h1 class="ask">Pick how</h1><div class="howlist">
     ${due?opt(`data-review="due"`,ic("timer"),"Review due today","Spaced repetition: the best way to remember",due+" due"):""}
     ${mis?opt(`data-review="mistakes"`,ic("q"),"Retest my mistakes","Questions you got wrong last time",mis+" Qs"):""}
     ${opt(`data-test="${m.id}" ${qs.length?"":"disabled"}`,ic("exam"),"Full past paper",qs.length?`MCQs, short answers, a case · timed`:"Add questions first",qs.length?qs.length+" Qs":"")}
     ${isPh?opt('data-game="tf"',ic("timer"),"True or false","60 seconds","Fun")+opt('data-game="match"',ic("match"),"Match it","Drugs and their hooks","Fun"):""}
     ${aiable.length?opt(`data-sheet="res" data-id="${aiable[0].id}"`,ic("spark"),"Questions from my notes",esc(aiable[0].title),"AI"):""}
     ${opt(`data-addq="${m.id}"`,ic("q"),"Add a past-paper question","From a past paper or CAT")}
    </div>
    ${TOPICS().some(t=>t.module===m.id)?`<p class="group-h">One topic only</p><div class="chips">${TOPICS().filter(t=>t.module===m.id).map(t=>`<button class="chip" data-test="${m.id}" data-topic="${t.id}">${t.name}</button>`).join("")}</div>`:""}
    ${qs.length?"":helper(m,"No questions yet. Add notes first")}`;

  if(g.id==="cases"){
    const cs=qs.filter(q=>q.type==="case");

    ${qs.filter(isMine).length?`<p class="group-h">My questions</p>${qList(qs.filter(isMine),m.id)}`:""}`;

const opt=(attrs,icon,title,sub,tag="")=>`<button class="how" ${attrs}><span class="howi">${icon}</span><span><b>${title}</b><em>${sub}</em></span>${tag?`<span class="howtag">${tag}</span>`:""}</button>`;
function sheet(m){
  const S=view.sheet; let title="", sub="", opts="";
  const qs=qsFor(m.id);
  if(S.kind==="whole"){
    title=`Study ${esc(m.name)}`; sub="Whole module";
    opts=opt(`data-test="${m.id}" ${qs.length?"":"disabled"}`,ic("exam"),"Past paper","Timed test")
     +(m.id==="pharm"?opt('data-game="tf"',ic("timer"),"True or false","60 seconds","Fun")+opt('data-game="match"',ic("match"),"Match it","Drugs and hooks","Fun"):"");
  }
  if(S.kind==="drug"){
    const d=DRUGS.find(x=>x.id===S.id), n=qs.filter(q=>q.topic===d.id).length;
    title=d.name; sub=esc(d.cls);
    opts=opt(`data-profile="${d.id}"`,ic("rx"),"Full summary","Body map, uses, nurse's duties","5 min")
     +opt(`data-open="${d.id}"`,ic("cards"),"Bite-size cards","Swipe 10 short cards","10 min")
     +opt(`data-test="pharm" data-topic="${d.id}"`,ic("exam"),"Test me",`${n} questions`)
     +opt(`data-casepop="${d.id}"`,ic("steth"),"Ward case","What would you do?");
  }
  if(S.kind==="cond"){
    const c=CONDITIONS.find(x=>x.id===S.id), n=qs.filter(q=>q.topic===c.id).length;
    title=c.name; sub=esc(c.system);
    opts=opt(`data-cond="${c.id}"`,ic("book"),"Full summary","Why it happens, signs, nursing process","8 min")
     +opt(`data-test="${m.id}" data-topic="${c.id}"`,ic("exam"),"Test me",`${n} questions`)
     +opt(`data-casepop="${c.id}"`,ic("steth"),"Ward case","What would you do?");
  }
  if(S.kind==="bridge"){
    const b=BRIDGE.find(x=>x.id===S.id), from=modById(b.module), ans=view.bans;
    title="Connect: "+esc(b.links.map(l=>l.label).join(", ")); sub=`${esc(from.name)}${b.topic?" · "+esc(topicName(b.topic)):""} ↔ ${b.links.map(l=>esc(modById(l.m).name)).join(", ")}`;
    opts=`<p class="qtext">${esc(b.q)}</p><div class="opts">${b.o.map((o,i)=>`<button class="opt ${ans!=null?(i===b.a?'right':i===ans?'wrong':''):''}" data-bans="${i}" ${ans!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>
     ${ans!=null?`<div class="explain"><b>${ans===b.a?"Correct.":"Not quite."}</b> ${linkTerms(esc(b.e))}</div>${b.topic?`<button class="how" ${topicAttr(topicById(b.topic))}><span class="howi">${ic("book")}</span><span><b>Open ${esc(topicName(b.topic))}</b><em>See it in context</em></span></button>`:""}${b.links.filter(l=>l.t).map(l=>`<button class="how" ${topicAttr(topicById(l.t))}><span class="howi">${ic("rx")}</span><span><b>Open ${esc(topicName(l.t))}</b><em>${esc(modById(l.m).name)}</em></span></button>`).join("")}`:""}`;
  }
  if(S.kind==="res"){
    const r=resFor(m.id).find(x=>x.id===S.id); if(!r){view.sheet=null;return ""}
    const canAI=!r.pack&&!r.ai&&(r.kind==="note"||(r.kind==="file"&&/^image\/|pdf$/.test(r.type||"")));
    title=esc(r.title); sub=r.ai?"AI draft · check with your notes":"My notes";
    if(r.kind==="file"){if(!urls[r.id])urls[r.id]=URL.createObjectURL(r.blob)}
    opts=(r.kind==="note"?`<div class="sheetnote">${esc(r.text)}</div>`:r.kind==="file"&&r.type.startsWith("image/")?`<img class="thumb big" src="${urls[r.id]}" alt="${esc(r.title)}">`:"")
     +(r.kind==="file"&&!r.type.startsWith("image/")?`<a class="how" href="${urls[r.id]}" target="_blank" rel="noopener"><span class="howi">${ic("file")}</span><span><b>Open PDF</b><em>Works offline</em></span></a>`:"")
     +(r.kind==="link"?`<a class="how" href="${esc(r.url)}" target="_blank" rel="noopener"><span class="howi">${ic("open")}</span><span><b>Open link</b><em>Needs data</em></span></a>`:"")
     +(canAI?(AI_BUSY[r.id]?`<div class="how busy"><span class="howi">${ic("spark")}</span><span><b>${esc(AI_BUSY[r.id])}</b><em>Keep this open</em></span></div>`:opt(`data-ai="${r.id}"`,ic("spark"),"Explain & quiz me (AI)","Key points + practice questions","AI")):"")
     +opt(`data-test="${m.id}" ${qs.length?"":"disabled"}`,ic("exam"),"Test me",`${qs.length} questions`)
     +opt(`data-addq="${m.id}" data-src="${esc(r.title)}"`,ic("q"),"Write a question","From these notes")
     +(r.pack?"":`<button class="linkbtn danger-link" data-del="${r.id}">${ic("trash")} Delete</button>`)
     +(confirmDel===r.id?`<div class="row-btns"><button class="btn small-btn danger-btn" data-delyes="${r.id}" data-store="res">Yes, delete</button><button class="btn small-btn" data-delno>Keep</button></div>`:"");
  }
  return `<div class="scrim" data-closesheet></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}">
   <div class="grab"></div>${stepper(3)}<h2>${title}</h2><p class="muted small">${sub}</p><div class="howlist">${opts}</div>
   <button class="btn wide" data-closesheet>Back</button></section>`;
}

let timerId=null;
function startReview(module,mode){

function startTest(module,topic,list=null,mode="paper"){
  if(list){ const items=list.map(q=>({q,sec:q.type==="mcq"?"A":q.type==="short"?"B":"C"})).sort((a,b)=>a.sec.localeCompare(b.sec));
    if(!items.length){toast("Nothing to review right now");return}
    view.test={module,topic:null,items,i:0,ans:{},self:{},start:Date.now(),done:false,mode,rec:{}};
    clearInterval(timerId); timerId=setInterval(()=>{const el=document.getElementById("clock");if(el)el.textContent=clock()},1000); render(); scrollTo(0,0); return; }
  let qs=qsFor(module); if(topic) qs=qs.filter(q=>q.topic===topic||(q.links||[]).some(l=>l.t===topic));
  const A=shuffle(qs.filter(q=>q.type==="mcq")).slice(0,topic?6:10), B=shuffle(qs.filter(q=>q.type==="short")).slice(0,topic?2:4), C=shuffle(qs.filter(q=>q.type==="case")).slice(0,1);
  const items=[...A.map(q=>({q,sec:"A"})),...B.map(q=>({q,sec:"B"})),...C.map(q=>({q,sec:"C"}))];
  if(!items.length){toast("No questions yet. Add some first.");return}
  view.test={module,topic,items,i:0,ans:{},self:{},start:Date.now(),done:false,mode,rec:{}};
  clearInterval(timerId); timerId=setInterval(()=>{const el=document.getElementById("clock");if(el)el.textContent=clock()},1000);
  render(); scrollTo(0,0);
}
const clock=()=>{const s=Math.floor(((view.test.end||Date.now())-view.test.start)/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

    ${q.ai?'<span class="aibadge">AI question · checked by you</span>':""}${q.links&&q.module!==T.module?`<span class="linkbadge">${ic("link")} From ${esc(modById(q.module).name)}</span>`:q.links?`<span class="linkbadge">${ic("link")} Connects to ${q.links.map(l=>esc(modById(l.m).name)).join(", ")}</span>`:""}<p class="qtext">${esc(q.q).replace(/\n/g,"<br>")}</p>

function markView(){
  const T=view.test; let got=0,total=0; const weak=new Set();
  const rows=T.items.map((it,i)=>{const q=it.q;
    if(q.type==="mcq"){total+=1;const ok=T.ans[i]===q.a;if(ok)got+=1;else if(q.topic)weak.add(q.topic);if(!T.rec[i]){T.rec[i]=1;recordAns(q,ok)}
      return `<div class="mark ${ok?'ok':'no'}"><p class="eyebrow">Q${i+1} · Section A · ${ok?"1/1":"0/1"}</p><p><b>${esc(q.q)}</b></p><p class="small">Your answer: ${T.ans[i]==null?"none":esc(q.o[T.ans[i]])}${ok?"":` · Correct: <b>${esc(q.o[q.a])}</b>`}</p>${q.e?`<p class="small muted">${linkTerms(esc(q.e))}</p>`:""}</div>`}
    total+=q.m||1; const s=T.self[i]; if(s!=null)got+=s; if(s!=null&&s<(q.m||1)/2&&q.topic)weak.add(q.topic);
    return `<div class="mark"><p class="eyebrow">Q${i+1} · ${it.sec==="B"?"Section B":"Section C"} · ${q.m||1} marks</p><p><b>${esc(q.q).replace(/\n/g,"<br>")}</b></p>
      <div class="cmp"><div><p class="eyebrow">Your answer</p><p class="small">${esc(T.ans[i]||"(blank)").replace(/\n/g,"<br>")}</p></div><div><p class="eyebrow">Marking scheme</p>${L(String(q.model).split("\n").filter(Boolean))}</div></div>
      <p class="small">Give yourself marks honestly:</p><div class="marks">${Array.from({length:(q.m||1)+1},(_,k)=>`<button class="mk ${s===k?'on':''}" data-self="${i}" data-v="${k}">${k}</button>`).join("")}</div></div>`});
  const unmarked=T.items.some((it,i)=>it.q.type!=="mcq"&&T.self[i]==null), pct=total?Math.round(got/total*100):0;
  if(!unmarked)saveAttempt(T,got,total);
  return `${back("Done")}<section class="result"><p class="eyebrow">${esc(modById(T.module).name)} · time ${clock()}</p><h1>${got} / ${total} marks${unmarked?"":` · ${pct}%`}</h1><p>${unmarked?"Mark your written answers below to see your final score.":pct>=70?"Strong paper. Keep it up.":pct>=50?"A pass. Revise the topics below.":"Keep going. Revise the topics below and try again."}</p>
   ${weak.size?`<div class="revise"><b>Revise:</b> ${[...weak].filter(topicById).map(id=>`<button class="pill strong" ${topicAttr(topicById(id))}>${esc(topicName(id))}</button>`).join(" ")}</div>`:""}
   <p class="small" style="opacity:.8">${ic("timer")} Wrong answers come back tomorrow; right ones in a few days. That's how you remember.</p>
   ${!unmarked&&!T.xp?`<button class="btn primary" data-claim>Collect +${Math.max(5,Math.round(pct/5))} XP</button>`:""}</section>
   <div class="stack">${rows.join("")}</div><button class="btn primary wide" data-test="${T.module}" ${T.topic?`data-topic="${T.topic}"`:""}>New paper</button>`;
}

/* ===================== AI HELPER (needs data; results saved offline) ===================== */
const AI_URL="/api/generate", AI_PER_DAY=5, AI_BUSY={};
function aiUsedToday(){const u=store.get("rn_ai",{day:null,n:0});return u.day===todayStr()?u.n:0}
function aiCount(){store.set("rn_ai",{day:todayStr(),n:aiUsedToday()+1})}
const b64=blob=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(blob)});
async function shrinkImage(blob){
  const url=URL.createObjectURL(blob);const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
  const sc=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
}
async function runAI(id){
  const r=USER.res.find(x=>x.id===id); if(!r)return;
  const redraw=()=>{const y=scrollY;render();scrollTo(0,y)};
  if(navigator.onLine===false){toast("You're offline. Connect to data to use the AI helper.");return}
  if(aiUsedToday()>=AI_PER_DAY){toast(`You've used today's ${AI_PER_DAY} AI requests. Try again tomorrow.`);return}
  AI_BUSY[id]="Preparing…";redraw();
  try{
    const body={module:modById(r.module).name,topic:r.topic?((DRUGS.find(d=>d.id===r.topic)||{}).name||""):""};
    if(r.kind==="note")body.text=r.text;
    else if(r.type.startsWith("image/")){const small=await shrinkImage(r.blob);body.file={type:"image/jpeg",data:await b64(small)}}
    else{if(r.size>2.9*1048576)throw new Error("This PDF is over 3 MB. Save just one chapter (a few pages) and add that instead.");body.file={type:"application/pdf",data:await b64(r.blob)}}
    AI_BUSY[id]="Reading… about 30 sec";redraw();
    let resp; try{resp=await fetch(AI_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)})}catch(e){throw new Error("Couldn't reach the AI helper. Check your data, or open the installed ScrubUp app (the AI doesn't work in this preview).")}
    let j={}; try{j=await resp.json()}catch(e){throw new Error("The AI helper only works in the installed ScrubUp app.")}
    if(!resp.ok)throw new Error(j.error||"The AI helper had a problem.");
    aiCount();
    const now=Date.now();
    await DB.put("res",{id:newId(),kind:"note",ai:true,title:"Revision points: "+r.title,module:r.module,topic:r.topic||"",text:j.summary.map(x=>"• "+x).join("\n"),added:now+1});
    for(const q of j.questions)await DB.put("qs",{...q,id:newId(),module:r.module,topic:r.topic||"",ai:true,checked:false,src:"AI draft from: "+r.title,added:now});
    delete AI_BUSY[id];await loadUser();redraw();addXP(10);
    toast(`${j.questions.length} questions made. Check them, then they join your tests.`);
  }catch(e){delete AI_BUSY[id];redraw();toast(e.message||"Something went wrong.")}
}

      ${r.pack?"":confirmDel===r.id?`<button class="btn small-btn danger-btn" data-delyes="${r.id}" data-store="res">Delete</button><button class="btn small-btn" data-delno>Keep</button>`:`<button class="x small-x" data-del="${r.id}" aria-label="Delete">×</button>`}</div>
      ${body}<div class="row-btns">${open}${canAI?(AI_BUSY[r.id]?`<span class="aistatus">${esc(AI_BUSY[r.id])}</span>`:`<button class="btn small-btn aibtn" data-ai="${r.id}">✦ Make revision questions with AI</button>`):""}<button class="btn small-btn" data-addq="${r.module}" data-src="${esc(r.title)}" data-topic="${r.topic||""}">+ Question from this</button></div></div>`}).join("")}</div>`;
}
function topicSelect(module,topic){return module==="pharm"?`<label>Drug (optional)<select id="f-topic"><option value="">Whole module</option>${DRUGS.map(d=>`<option value="${d.id}" ${d.id===topic?"selected":""}>${d.name}</option>`).join("")}</select></label>`:""}
function moduleSelect(module){return `<label>Module<select id="f-module">${allModules().map(m=>`<option value="${m.id}" ${m.id===module?"selected":""}>${esc(m.name)}</option>`).join("")}</select></label>`}
function resFormHTML(module,topic){

   <div class="seg" role="group" aria-label="Type">${[["file","Photo or PDF"],["link","Drive / web link"],["note","My note"]].map(([x,l])=>`<button type="button" data-kind="${x}" aria-pressed="${k===x}">${l}</button>`).join("")}</div>

   ${k==="note"?`<label>Note<textarea id="f-text" rows="4" required></textarea></label>`:""}

function qFormHTML(module){
  const k=form.kind||"mcq";
  return `<form class="card-form" id="qform"><h3>Add a past-paper question</h3>
   <div class="seg" role="group" aria-label="Question type">${[["mcq","Multiple choice"],["short","Short answer"],["case","Case study"]].map(([x,l])=>`<button type="button" data-qkind="${x}" aria-pressed="${k===x}">${l}</button>`).join("")}</div>

     :`<label>Marks<input id="f-m" type="number" min="1" max="20" value="${k==="case"?6:4}"></label><label>Marking scheme: one point per line<textarea id="f-model" rows="4" required placeholder="Point 1&#10;Point 2"></textarea></label>`}

function formFor(module){ if(!form)return ""; if(form.type==="res")return resFormHTML(module,form.topic); if(form.type==="q")return qFormHTML(module); return ""; }
function qList(list,module){
  if(!list.length)return `<p class="muted small">No questions of your own yet. Copy questions from past papers, CATs or your lecturer's revision list, then test yourself.</p>`;
  return `<div class="reslist">${list.map(q=>`<div class="res"><div class="res-top"><span class="rkind">${{mcq:"MCQ",short:"SAQ",case:"CASE"}[q.type]}</span><div style="min-width:0;flex:1"><b>${esc(q.q.slice(0,120))}${q.q.length>120?"…":""}</b><div class="muted small">${esc(q.src||"My question")}</div>${q.ai?'<span class="aibadge">AI draft · check with your notes</span>':""}</div>${q.pack?"":confirmDel===q.id?`<button class="btn small-btn danger-btn" data-delyes="${q.id}" data-store="qs">Delete</button><button class="btn small-btn" data-delno>Keep</button>`:`<button class="x small-x" data-del="${q.id}" aria-label="Delete">×</button>`}</div></div>`).join("")}</div>`;
}
async function onSubmit(e){
  e.preventDefault(); const g=id=>document.getElementById(id), err=g("f-err"), fail=t=>{err.hidden=false;err.textContent=t};
  try{
    if(e.target.id==="modform"){const name=g("m-name").value.trim();const code=(g("m-code").value.trim()||name.slice(0,2)).toUpperCase();const m={id:"m_"+newId(),name,code,color:"var(--nur)",added:Date.now()};await DB.put("mods",m);form=null;await loadUser();P.mod=m.id;save();view.module=m.id;view.tab="home";render();scrollTo(0,0);toast("Module added");return}
    const module=g("f-module").value, topic=g("f-topic")?g("f-topic").value:"";
    if(e.target.id==="resform"){
      const r={id:newId(),kind:form.kind||"file",title:g("f-title").value.trim(),module,topic,added:Date.now()};
      if(r.kind==="file"){const f=g("f-file").files[0];if(!f)return fail("Choose a file first.");if(f.size>25*1048576)return fail("That file is over 25 MB. Save just the chapter you need.");Object.assign(r,{blob:f,name:f.name,type:f.type||"application/octet-stream",size:f.size})}
      if(r.kind==="link")r.url=g("f-url").value.trim(); if(r.kind==="note")r.text=g("f-text").value.trim();
      await DB.put("res",r); form=null; await loadUser(); addXP(5); render(); toast("Saved on this phone"); return;
    }
    if(e.target.id==="qform"){
      const k=form.kind||"mcq"; const q={id:newId(),module,topic,type:k,q:g("f-q").value.trim(),src:g("f-src").value.trim()||"My question",added:Date.now()};
      if(k==="mcq"){q.o=[0,1,2,3].map(i=>g("f-o"+i).value.trim());q.a=+document.querySelector('input[name="f-a"]:checked').value;q.e=g("f-e").value.trim()}
      else{q.m=Math.max(1,+g("f-m").value||1);q.model=g("f-model").value.trim()}
      await DB.put("qs",q); form=null; await loadUser(); addXP(5); render(); toast("Question saved"); return;
    }
  }catch(x){fail("Couldn't save on this phone. Free some storage and try again.")}
}

/* ===================== WORDS + NOTES ===================== */
function words(){return `<h1 class="ph">Word bank</h1><p class="muted small sub">Hard words, made simple.</p><input class="search" id="wsearch" type="search" placeholder="Search a word…" aria-label="Search words"><div class="stack" id="wlist">${wordList("")}</div>`}
const wordList=s=>WORDS.filter(w=>!["Liver toxicity","Anaerobic"].includes(w[0])&&(w[0]+" "+w[1]).toLowerCase().includes(s)).sort((a,b)=>a[0].localeCompare(b[0])).map(([w,m,sw])=>`<div class="word"><b>${esc(w)}</b>${esc(m)}${sw?`<em>Kiswahili: ${esc(sw)}</em>`:""}</div>`).join("")||'<p class="muted">No match yet.</p>';
function notesView(){const lbl={ok:["Correct","b-ok"],fix:["Fix","b-fix"],add:["Add","b-add"]};
  return `${back("Back")}<h1 class="ph">Notes check: Flucytosine</h1><div class="stack">${NOTES.map(n=>`<div class="nrow"><span class="badge ${lbl[n.s][1]}">${lbl[n.s][0]}</span><p class="said">"${esc(n.said)}"</p><p style="margin:0">${linkTerms(n.fix)}</p></div>`).join("")}</div><button class="btn primary wide" data-profile="flucytosine">Open the Flucytosine profile</button>`}

/* ===================== RENDER + EVENTS ===================== */
function render(){
  const tabKey=view.tab;
  document.querySelectorAll(".tabbtn").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tabKey?"page":"false"));
  if(view.deck){app.innerHTML=deck();const dk=document.getElementById("deck");dk.scrollLeft=view.slide*(dk.clientWidth+12);dk.addEventListener("scroll",()=>{const i=Math.round(dk.scrollLeft/(dk.clientWidth+12));if(i!==view.slide){view.slide=i;document.querySelectorAll(".segs i").forEach((s,k)=>s.classList.toggle("on",k<=i));const [b,n]=document.querySelectorAll("[data-step]");b.disabled=i===0;n.disabled=i===dk.children.length-1}},{passive:true});return}
  if(view.game){app.innerHTML=gameView();return}
  if(view.test){app.innerHTML=testView();return}
  if(view.notes){app.innerHTML=notesView();return}
  if(view.cases){app.innerHTML=casesView();return}
  if(view.install){app.innerHTML=installView();return}
  if(view.casepop){app.innerHTML=casePop(topicById(view.casepop));return}
  if(view.cond){app.innerHTML=condView()+(view.sheet?sheet(modById(CONDITIONS.find(c=>c.id===view.cond).module)):"");return}
  if(view.profile){app.innerHTML=profile()+(view.sheet?sheet(modById("pharm")):"");return}
  if(view.module){app.innerHTML=moduleView();return}
  app.innerHTML=({home,practice,library,words}[tabKey]||home)();
  if(tabKey==="words")document.getElementById("wsearch").addEventListener("input",e=>{document.getElementById("wlist").innerHTML=wordList(e.target.value.toLowerCase())});
}
const go=(patch)=>{clearInterval(timerId);form=null;confirmDel=null;view={...view,deck:null,game:null,test:null,notes:false,cases:false,install:false,sheet:null,casepop:null,cond:null,tray:false,bans:null,psec:null,...patch};render();scrollTo(0,0)};
function goBack(){
  if(view.deck||view.game||view.test){clearInterval(timerId);view.deck=null;view.game=null;view.test=null;form=null;render();scrollTo(0,0);return}
  if(view.notes||view.cases||view.install){view.notes=false;view.cases=false;view.install=false;render();scrollTo(0,0);return}
  if(view.casepop){const t=topicById(view.casepop);view.sheet={kind:t&&t.kind==="cond"?"cond":"drug",id:view.casepop};view.casepop=null;render();return}
  if(view.cond){const mod=CONDITIONS.find(c=>c.id===view.cond).module;go({cond:null,organ:null,module:mod,goal:view.goal||"learn",tab:"home"});return}
  if(view.tray){view.tray=false;render();scrollTo(0,0);return}
  if(view.profile){go({profile:null,organ:null,module:"pharm",goal:view.goal||"learn",tab:"home"});return}
  if(view.module&&view.goal){form=null;view.goal=null;view.sheet=null;render();scrollTo(0,0);return}
  if(view.module){go({module:null,goal:null,tab:"home"});return}
  go({});
}
function saveTA(){const ta=document.getElementById("ta");if(ta&&view.test)view.test.ans[view.test.i]=ta.value}

document.addEventListener("submit",onSubmit);
document.addEventListener("click",e=>{
  const term=e.target.closest(".term");document.querySelectorAll(".tip").forEach(t=>t.remove());
  if(term){e.preventDefault();const t=termMap[term.dataset.term.toLowerCase()];const tip=document.createElement("span");tip.className="tip";tip.innerHTML=`<b>${esc(t.w)}</b>: ${esc(t.m)}${t.sw?`<br><i>Kiswahili: ${esc(t.sw)}</i>`:""}`;term.appendChild(tip);return}
  const $=s=>e.target.closest(s); let el;
  if(el=$("[data-tab]"))return go({tab:el.dataset.tab,module:null,profile:null});
  if($("[data-back]"))return goBack();
  if($("[data-reload]")){location.reload();return}
  if(el=$("[data-psec]")){view.psec=el.dataset.psec;view.sheet=null;render();const t=document.querySelector(".ptabs");if(t)t.querySelector('[aria-current="true"]')?.scrollIntoView({inline:"center",block:"nearest"});scrollTo(0,0);return}
  if(el=$("[data-organ]")){view.organ=el.dataset.organ;const d=topicById(view.cond||view.profile);document.getElementById("organ").innerHTML=organPanel(d,view.organ);document.querySelectorAll(".spot").forEach(s=>{const on=s.dataset.organ===view.organ;s.classList.toggle("on",on);s.querySelectorAll("circle")[1].setAttribute("r",on?9:7)});return}
  if($("[data-closesheet]")){view.sheet=null;confirmDel=null;const y=scrollY;render();scrollTo(0,y);return}
  if(el=$("[data-goal]")){view.goal=el.dataset.goal;form=null;render();scrollTo(0,0);return}
  if(el=$("[data-bans]")){const b=BRIDGE.find(x=>x.id===view.sheet.id);view.bans=+el.dataset.bans;const ok=view.bans===b.a;recordAns(b,ok);if(ok)addXP(3);const y=scrollY;render();scrollTo(0,y);return}
  if(el=$("[data-cond]")){const c=CONDITIONS.find(x=>x.id===el.dataset.cond);P.mod=c.module;save();return go({cond:c.id,organ:null,profile:null,module:c.module,goal:view.goal||"learn",tab:"home"})}
  if(el=$("[data-review]")){view.sheet=null;startReview(view.module||curMod().id,el.dataset.review);return}
  if($("[data-tray]")){view.tray=true;view.sheet=null;render();scrollTo(0,0);return}
  if($("[data-traydone]")){view.tray=false;render();scrollTo(0,0);return}
  if(el=$("[data-approve]")){const q=USER.qs.find(x=>x.id===el.dataset.approve);if(q){DB.put("qs",{...q,checked:true}).then(loadUser).then(()=>{const y=scrollY;render();scrollTo(0,y);toast("Added to your tests");addXP(2)})}return}
  if(el=$("[data-sheet]")){view.bans=null;view.sheet={kind:el.dataset.sheet,id:el.dataset.id||null};const y=scrollY;render();scrollTo(0,y);return}
  if(el=$("[data-casepop]")){view.sheet=null;view.casepop=el.dataset.casepop;render();scrollTo(0,0);return}
  if(el=$("[data-module]")){P.mod=el.dataset.module;save();libFilter=P.mod;return go({tab:"home",module:el.dataset.module,goal:null,profile:null})}
  if(el=$("[data-profile]")){P.mod="pharm";save();return go({profile:el.dataset.profile,organ:null,module:"pharm",goal:view.goal||"learn",tab:"home"})}
  if(el=$("[data-open]")){view.sheet=null;view.deck=el.dataset.open;view.slide=0;render();scrollTo(0,0);return}
  if(el=$("[data-step]")){const dk=document.getElementById("deck");dk.scrollTo({left:(view.slide+ +el.dataset.step)*(dk.clientWidth+12),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  if(el=$("[data-why]")){el.querySelector(".ans").hidden=false;el.querySelector(".tap").hidden=true;return}
  if(el=$("[data-dq]")){const q=QUIZ[+el.dataset.dq],pick=+el.dataset.o;recordAns({id:"bq"+el.dataset.dq},pick===q.a);const blk=el.closest(".qblock");blk.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("right");else if(i===pick)b.classList.add("wrong")});const ex=blk.querySelector(".explain");ex.hidden=false;ex.innerHTML=`<b>${pick===q.a?"Correct.":"Not quite."}</b> ${linkTerms(esc(q.e))}`;if(pick===q.a)addXP(5);return}
  if(el=$("[data-finish]")){P.done[el.dataset.finish]=true;addXP(20);view.deck=null;render();scrollTo(0,0);return}
  if($("[data-notes]")){view.notes=true;render();scrollTo(0,0);return}
  if($("[data-cases]")){go({cases:true});return}
  if($("[data-install]")){go({install:true,installTab:null});return}
  if(el=$("[data-itab]")){view.installTab=el.dataset.itab;render();return}
  if($("[data-doinstall]")){if(installPrompt){installPrompt.prompt();installPrompt.userChoice.finally(()=>{installPrompt=null;render()})}return}
  if($("[data-share]")){const url=location.origin.startsWith("http")?location.origin:"";const text="ScrubUp: free nursing revision app with drug notes, past-paper tests and ward cases. Works offline.";
    if(navigator.share){navigator.share({title:"ScrubUp",text,url}).catch(()=>{})}else if(navigator.clipboard&&url){navigator.clipboard.writeText(url).then(()=>toast("Link copied")).catch(()=>toast("Copy the link shown"))}else toast("Copy the link shown");return}
  if($("[data-pickTest]")||$("[data-picktest]"))return go({tab:"practice",module:null,profile:null});
  if(el=$("[data-test]")){view.sheet=null;startTest(el.dataset.test,el.dataset.topic||null);return}
  if(el=$("[data-tans]")){view.test.ans[view.test.i]=+el.dataset.tans;render();return}
  if($("[data-tnext]")){saveTA();const T=view.test;if(T.i<T.items.length-1){T.i++}else{T.done=true;clearInterval(timerId);T.end=Date.now()}render();scrollTo(0,0);return}
  if($("[data-tprev]")){saveTA();view.test.i--;render();return}
  if(el=$("[data-self]")){const T=view.test,i=+el.dataset.self,q=T.items[i].q;T.self[i]=+el.dataset.v;if(!T.rec[i]){T.rec[i]=1;recordAns(q,T.self[i]>=(q.m||1)/2)}const y=scrollY;render();scrollTo(0,y);return}
  if($("[data-claim]")){const T=view.test;let got=0,total=0;T.items.forEach((it,i)=>{if(it.q.type==="mcq"){total++;if(T.ans[i]===it.q.a)got++}else{total+=it.q.m||1;got+=T.self[i]||0}});T.xp=true;addXP(Math.max(5,Math.round(got/total*100/5)));render();return}
  if(el=$("[data-game]")){view.sheet=null;startGame(el.dataset.game);scrollTo(0,0);return}
  if(el=$("[data-tf]")){if(!G||G.over)return;const s=G.list[G.i%G.list.length];const ok=(el.dataset.tf==="1")===s[1];if(ok)G.score++;G.i++;render();const c=document.getElementById("tfcard");if(c)c.classList.add(ok?"flash-ok":"flash-no");if(!ok)toast(`It was ${s[1]?"TRUE":"FALSE"}`);return}

  if(el=$("[data-qkind]")){form.kind=el.dataset.qkind;render();document.getElementById("qform")?.scrollIntoView({block:"center"});return}

});
